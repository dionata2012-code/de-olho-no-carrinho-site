/* ---------- Conquistas: economia, selos em séries e desafios ----------
   Economia: cada compra é comparada com o preço médio do mesmo produto nos seus mercados, em 45 dias para cada lado da compra
   (média de cada mercado, todos com o mesmo peso). Só entra quando há preço de pelo menos 2 mercados nesse período.
   Pagou abaixo da média: a diferença soma na economia. Pagou acima: vai para "dava para economizar mais". Nada é descontado.
   Preço "para conferir", produto de farmácia e diferença maior que o dobro (outro tamanho ou erro de leitura) ficam de fora.

   só os ganhos depois disso aparecem com comemoração.

   categorias). Cada correção feita conta para a série "Ajudante do app". */

/* Mais largo (380) e com o desenho deslocado 20 para a direita, para as legendas não ficarem por cima do alimento. */
function dsvgW(lbl,vb,corpo){return dsvg(lbl,vb,'<g transform="translate(20,0)">'+corpo+'</g>')}
/* Peças comuns dos desenhos: legenda com seta (à esquerda ou à direita), rodapé e comparação certo × errado. */
/* A seta sai do lado do texto (largura estimada pelo número de letras), para nunca passar por cima da legenda. */
function dlab(lado,y,t,sub,ax,ay,cor){var x=lado=="l"?-8:354,an=lado=="l"?"start":"end",w=Math.max(String(t).length,String(sub||"").length)*6.3,x0=lado=="l"?x:x-w,x1=lado=="l"?x+w:x,top=y-13,bot=y+(sub?19:5),sx,sy;
/* alvo ao lado do texto: a seta sai da lateral; alvo acima ou abaixo da faixa do texto: sai da borda de cima ou de baixo */
if(ax>x1+4||ax<x0-4){sx=ax>x1?x1+4:x0-4;sy=Math.max(top,Math.min(bot,ay))}else{sx=Math.max(x0+6,Math.min(x1-6,ax));sy=ay<y?top-2:bot+4}
return dseta(sx,sy,ax,ay)+'<text x="'+x+'" y="'+y+'" text-anchor="'+an+'"'+(cor?' fill="'+cor+'"':'')+'>'+t+'</text>'+(sub?'<text x="'+x+'" y="'+(y+14)+'" text-anchor="'+an+'" font-weight="400" fill="var(--soft)">'+sub+'</text>':'')}
function dpe(t,y){return'<text x="170" y="'+(y||224)+'" text-anchor="middle" font-weight="400" fill="var(--soft)">'+t+'</text>'}
function dcmp(ok,bad,cOk,sOk,cBad,sBad,H){H=H||230;return'<text x="90" y="16" text-anchor="middle" font-size="14" font-weight="700" fill="var(--acc)">✓ '+cOk+'</text><text x="250" y="16" text-anchor="middle" font-size="14" font-weight="700" fill="var(--warn,#b45309)">✗ '+cBad+'</text><line x1="170" y1="4" x2="170" y2="'+(H-6)+'" stroke="var(--line)"/>'+ok+bad+'<text x="90" y="'+(H-10)+'" text-anchor="middle" font-weight="400" fill="var(--soft)">'+sOk+'</text><text x="250" y="'+(H-10)+'" text-anchor="middle" font-weight="400" fill="var(--soft)">'+sBad+'</text>'}

else if(DR&&k=="loja"){DR.loja=t.value;var ev2=document.getElementById("apv");if(ev2)ev2.innerHTML=apv()}});
